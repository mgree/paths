name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Valgrind is for the tests (which check it catches a leaked descriptor)
      # and the last step. The runner image already has gcc and clang.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      # Ubuntu's AppArmor default lets unprivileged processes create user
      # namespaces but not mount in them; the mount fixtures need both. The
      # sanitizer build crashes at startup when the kernel randomizes memory
      # more than this GCC's AddressSanitizer expects.
      - name: Configure the kernel
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo sysctl -w vm.mmap_rnd_bits=28

      # pyproject.toml points pyright at .venv, so CI uses one too.
      - name: Install dev tools
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install --group dev

      - name: Check that mounts work
        run: .venv/bin/python -c "from treegen import ns; r = ns.why_no_mounts(); assert r is None, r"

      - name: Formatting
        run: .venv/bin/ruff format --check .

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Type checking
        run: .venv/bin/pyright

      - name: Build the C driver and the racer
        run: |
          make -C strategies/c
          make -C runner/racer

      - name: Static analysis of the C driver
        run: make -C strategies/c analyze

      - name: Tests
        run: .venv/bin/pytest -v

      # Both exit 1 on a driver failure (a crash, a sanitizer or valgrind
      # report), which is a bug in our code; failed verdicts are findings.
      - name: Correctness suite, under every root shape
        run: .venv/bin/python -m runner.check --no-build --root-shape all

      - name: Correctness suite under valgrind (descriptor and memory leaks)
        run: .venv/bin/python -m runner.check --no-build --valgrind
