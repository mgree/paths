[project]
name = "paths-study"
version = "0.0.1"
description = "Path handling correctness and cost study"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
dependencies = []

[dependency-groups]
# Pinned: formatter output changes between releases. pyperf provides
# `pyperf system tune`, which readies the machine for benchmarks. Releases
# through 2.11.0 have two bugs that make tune fail here: they can't read
# version strings like Debian's "7.3.4+deb14-amd64", and on Linux 6.12 and
# later they stop moving IRQs at the first one that can't be moved. This
# commit on psf/pyperf's main fixes both (#280 and #281). Move to the first
# release after 2.11.0.
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
    "pyright==1.1.414",
    "pyperf @ git+https://github.com/psf/pyperf.git@5d1ee0dd5aaa825982401c617638a607c865d203",
]

[tool.pytest.ini_options]
testpaths = ["treegen/tests", "protocol/tests", "runner/tests", "tools/tests"]
pythonpath = ["."]
markers = ["slow: takes much longer than the rest on this host"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# ruff's defaults (syntax errors, undefined and unused names) plus bugbear's
# likely-bug patterns.
select = ["E4", "E7", "E9", "F", "B"]

[tool.pyright]
include = ["treegen", "tools", "protocol", "runner", "harness"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportDeprecated = "error"
venvPath = "."
venv = ".venv"
