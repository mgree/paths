hazard = "Joining onto an absolute path"
about = """An absolute request names a host path, not one inside the root. Beneath strategies \
must refuse it; in-root strategies read it as relative to the root."""

[root]
files = ["etc/passwd"]

[request]
op = "read"
path = "/etc/passwd"

[expect]
result = "refused"

[expect.in_root]
result = "ok"
file = "etc/passwd"
