hazard = "Length limits"
about = """Past PATH_MAX, then 20 .. back to the root. Wherever a strategy splits the path to fit \
PATH_MAX, the climb crosses the split, so scoping each piece to where the previous one \
ended refuses it or misses g. The scope must stay the real root."""

[root]
files = ["", "g"]

[request]
op = "read"
path = "../../../../../../../../../../../../../../../../../../../../g"

[expect]
result = "ok"
file = "g"
