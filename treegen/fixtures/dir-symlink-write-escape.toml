hazard = "Symlink escape"
about = """The escaping symlink is a middle component, not the last, so O_NOFOLLOW (which guards \
only the last) does not stop this write from creating or truncating a file outside the \
root."""

[root]
symlinks = { "d" = "../outside-dir" }

[outside]
files = ["outside-dir/f"]

[request]
op = "write"
path = "d/f"

[expect]
result = "refused"

[expect.in_root]
result = "error"
errno = "ENOENT"   # .. clamps at the root, and root/outside-dir doesn't exist
