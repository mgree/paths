hazard = "Comparing paths as strings"
about = """A string-prefix check calls ../foobar/x inside root foo, because foobar starts with \
foo. Containment must compare whole path components."""
root_name = "foo"

[root]
files = ["x"]

[outside]
files = ["foobar/x"]

[request]
op = "read"
path = "../foobar/x"

[expect]
result = "refused"

[expect.in_root]
result = "error"
errno = "ENOENT"
