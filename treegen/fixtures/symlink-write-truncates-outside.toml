hazard = "Symlink escape"
about = """write follows a final symlink, so a planted link turns an ordinary write into \
truncating a file outside the root (the classic /tmp attack)."""

[root]
symlinks = { "link" = "{sandbox}/secret" }

[outside]
files = ["secret"]

[request]
op = "write"
path = "link"

[expect]
result = "refused"

[expect.in_root]
result = "error"
errno = "ENOENT"
