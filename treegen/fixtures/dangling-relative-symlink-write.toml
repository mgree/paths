hazard = "Dangling symlinks"
about = """write creates whatever a dangling final symlink names. This one climbs out of the \
root, so its target must not be created outside: beneath refuses, and in-root clamps \
the .. at the root and creates the file inside."""

[root]
symlinks = { "new" = "../created" }

[request]
op = "write"
path = "new"

[expect]
result = "refused"

[expect.in_root]
result = "ok"
file = "created"
