hazard = "Symlink escape"
about = """A symlink need not be absolute to escape: relative text with enough .. climbs out of \
the root."""

[root]
symlinks = { "a/link" = "../../x" }

[outside]
files = ["x"]

[request]
op = "read"
path = "a/link"

[expect]
result = "refused"

[expect.in_root]
result = "error"
errno = "ENOENT"
