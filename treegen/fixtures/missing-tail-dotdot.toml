hazard = "Missing tail"
about = """Lexical cleaning changes what a path means: the kernel needs missing to exist before \
.. can leave it, so missing/../x names nothing, while a lexical strategy (S1) opens x."""

[root]
files = ["x"]

[request]
op = "read"
path = "missing/../x"

[expect]
result = "error"
errno = "ENOENT"
