hazard = "Missing tail"
about = """Logical resolution of .. changes what a path means: the kernel needs missing to \
exist before .. can leave it, so missing/../x names nothing, while the logical strategy \
opens x."""

[root]
files = ["x"]

[request]
op = "read"
path = "missing/../x"

[expect]
result = "error"
errno = "ENOENT"
