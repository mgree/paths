hazard = "Symlink escape"
about = "An absolute symlink inside the root points at a directory outside it."

[root]
symlinks = { "link" = "{sandbox}/secret" }

[outside]
files = ["secret/x"]

[request]
op = "read"
path = "link/x"

[expect]
result = "refused"

[expect.in_root]
result = "error"
errno = "ENOENT"
