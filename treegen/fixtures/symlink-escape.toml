hazard = "Symlink escape"
about = """The plain symlink escape: an absolute link inside the root names a directory outside \
it."""

[root]
symlinks = { "link" = "{sandbox}/secret" }

[outside]
files = ["secret/x"]

[request]
op = "read"
path = "link/x"

[expect]
result = "refused"

[expect.in_root]
result = "error"
errno = "ENOENT"
