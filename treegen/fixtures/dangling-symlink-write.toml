hazard = "Dangling symlinks"
about = """write creates whatever a dangling final symlink names. This one is absolute and names \
a path outside the root, which must not be created."""

[root]
symlinks = { "new" = "{sandbox}/created" }

[request]
op = "write"
path = "new"

[expect]
result = "refused"

[expect.in_root]
result = "error"
errno = "ENOENT"   # re-anchored inside the root, where the target's parents don't exist
