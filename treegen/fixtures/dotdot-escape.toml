hazard = ".. escape"
about = """The simplest escape, with no links at all: .. climbs above the root. Any strategy that \
checks paths must refuse it."""

[root]
dirs = ["a"]

[outside]
files = ["x"]

[request]
op = "read"
path = "a/../../x"

[expect]
result = "refused"

[expect.in_root]
result = "error"
errno = "ENOENT"
