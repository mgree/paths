hazard = "Dangling symlinks"
about = """O_EXCL never follows a final symlink, so newfile through a dangling one fails with \
EEXIST and creates nothing, even in a naive strategy. A strategy that emulates newfile \
by following the link and then creating loses that guarantee."""

[root]
symlinks = { "new" = "{sandbox}/created" }

[request]
op = "newfile"
path = "new"

[expect]
result = "error"
errno = "EEXIST"
