hazard = "Symlink escape"
about = """A write through a link that stays inside the root must, if it succeeds, truncate the \
link's target. Refusing every final symlink on write (O_NOFOLLOW, common hardening) is \
also accepted: whether to follow is a policy question."""

[root]
files = ["real/f"]
symlinks = { "link" = "real/f" }

[request]
op = "write"
path = "link"

[expect]
accept = [{ result = "ok", file = "real/f" }, { result = "refused" }]
