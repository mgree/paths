hazard = "Hard links"
about = """A hard link is the outside file itself, so no path check can see that writing h \
truncates a file outside the root. Both are accepted: refusing needs an st_nlink \
policy (refuse files with other names), which privileged writers such as Postfix's \
local delivery apply."""

[root]
hardlinks = { "h" = "outside:secret" }

[outside]
files = ["secret"]

[request]
op = "write"
path = "h"

[expect]
accept = [
  { result = "ok", file = "h" },
  { result = "refused" },   # a strategy enforcing an st_nlink policy
]
outside_changes = ["secret"]
