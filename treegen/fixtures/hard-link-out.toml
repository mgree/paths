hazard = "Hard links"
about = """A hard link is the outside file itself, so no path check can tell it from a file \
inside, and reading it is expected. The st_nlink policy that refuses linked files \
exists for privileged writes (hard-link-out-write), not reads."""

[root]
hardlinks = { "h" = "outside:secret" }

[outside]
files = ["secret"]

[request]
op = "read"
path = "h"

[expect]
result = "ok"
file = "h"
