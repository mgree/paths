hazard = "Symlink escape"
about = """An absolute link that spells the root's own host path stays inside, but only a \
resolve-then-check strategy (S2) can follow it. Both are accepted; opening leaks the \
root's host location to whoever can plant links."""

[root]
files = ["real/f"]
symlinks = { "link" = "{root}/real" }

[request]
op = "read"
path = "link/f"

[expect]
accept = [
  { result = "refused" },
  { result = "ok", file = "real/f" },
]

[expect.in_root]
accept = [
  { result = "error", errno = "ENOENT" },
  { result = "ok", file = "real/f" },
]
